<script>
(() => {
 'use strict';
 const canvas = document.getElementById('scene');
 const ctx = canvas.getContext('2d', {alpha:false});
 const art = document.getElementById('roseArt');
 const ART_W = 570, ART_H = 830;
 let dpr=1, width=0, height=0, drawW=0, drawH=0, left=0, top=0;
 let particles=[], dust=[], bitmap=null, generation=0, startAt=performance.now(), loaded=false;
 const DURATION=5700;
 const rnd=(a,b)=>Math.random()*(b-a)+a;
 const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
 const smooth=t=>t*t*(3-2*t);
 const ease=t=>1-Math.pow(1-t,3);
 const prefersReduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

 function resize() {
   const oldW=width, oldH=height;
   width=window.innerWidth;
   height=window.innerHeight;
   dpr=Math.min(window.devicePixelRatio||1,2);
   canvas.width=Math.max(1,Math.round(width*dpr));
   canvas.height=Math.max(1,Math.round(height*dpr));
   canvas.style.width=width+'px';canvas.style.height=height+'px';
   ctx.setTransform(dpr,0,0,dpr,0,0);
   const k=Math.min(width*.96/ART_W, height*.94/ART_H, 1.18);
   drawW=ART_W*k; drawH=ART_H*k;
   left=(width-drawW)/2; top=(height-drawH)/2;
   if(loaded && (oldW!==width || oldH!==height)) seed();
 }

 function seed() {
   if(!bitmap)return;
   const sample=document.createElement('canvas');
   sample.width=ART_W; sample.height=ART_H;
   const sc=sample.getContext('2d',{willReadFrequently:true});
   sc.drawImage(bitmap,0,0,ART_W,ART_H);
   const pix=sc.getImageData(0,0,ART_W,ART_H).data;
   const candidates=[];
   const step=width<560 ? 4 : 3;
   for(let y=0;y<ART_H;y+=step){
     for(let x=0;x<ART_W;x+=step){
       let px=x+(Math.random()*step|0), py=y+(Math.random()*step|0);
       let idx=(py*ART_W+px)*4;
       const alpha=pix[idx+3];
       if(alpha<55)continue;
       const luminance=Math.max(pix[idx],pix[idx+1]*1.4);
       if(Math.random()>.42+luminance/520)continue;
       candidates.push({x:px,y:py,r:pix[idx],g:pix[idx+1],b:pix[idx+2],a:alpha/255});
     }
   }
   for(let i=candidates.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[candidates[i],candidates[j]]=[candidates[j],candidates[i]];}
   const cap=width<560 ? 3500 : 5600;
   const k=drawW/ART_W;
   particles=candidates.slice(0,cap).map(p=>{
     const tx=left+p.x*k, ty=top+p.y*k;
     const a=rnd(0,Math.PI*2), radius=rnd(45,Math.min(width,height)*.57+90);
     const sx=tx+Math.cos(a)*radius, sy=ty+Math.sin(a)*radius;
     let bloom=p.y<450 && p.y>70;
     let group=bloom?1:(p.y>530?0:1);
     return {tx,ty,sx,sy,x:sx,y:sy,vel:0,group,start:rnd(.15,2.0)+(group?0.7:0),length:rnd(1.9,3.6),
       r:p.r,g:p.g,b:p.b,a:p.a,size:rnd(.5,1.6),phase:rnd(0,6.28)};
   });
   dust=Array.from({length:width<560?65:100},()=>({
     x:rnd(0,width),y:rnd(0,height),speed:rnd(.12,.6),r:rnd(.4,1.8),phase:rnd(0,6.28),opacity:rnd(.08,.37)
   }));
   startAt=performance.now();
   generation++;
 }

 function render(now){
   ctx.setTransform(dpr,0,0,dpr,0,0);
   ctx.fillStyle='#000';ctx.fillRect(0,0,width,height);
   if(!bitmap){requestAnimationFrame(render);return;}
   const t=prefersReduced?DURATION/1000:(now-startAt)/1000;
   const settling=smooth(clamp((t-3.3)/2.2));
   const reveal=smooth(clamp((t-3.6)/1.55));
   // Uma arte vetorial, nítida em qualquer resolução, toma o lugar dos pontos ao final.
   if(reveal>0){
     ctx.save();ctx.globalAlpha=reveal;
     ctx.shadowColor='#d50929';ctx.shadowBlur=10;
     ctx.drawImage(bitmap,left,top,drawW,drawH);
     ctx.restore();
   }
   ctx.save();ctx.globalCompositeOperation='lighter';
   for(let i=0;i<particles.length;i++){
     const p=particles[i];
     let u=clamp((t-p.start)/p.length);
     const e=ease(u);
     const drift=(1-e)*Math.sin(now*.003+p.phase)*11;
     const x=p.sx+(p.tx-p.sx)*e+drift;
     const y=p.sy+(p.ty-p.sy)*e+(1-e)*Math.cos(now*.002+p.phase)*10;
     let fadeIn=smooth(clamp(u*8));
     let fadeOut=1-smooth(clamp((t-4.2)/1.3));
     const alpha=p.a*fadeIn*fadeOut;
     if(alpha<=.007)continue;
     let rad=p.size*(.5+Math.min(1,drawW/400));
     ctx.fillStyle=`rgba(${Math.max(p.r,160)},${p.g},${p.b},${alpha})`;
     ctx.beginPath();ctx.arc(x,y,rad,0,Math.PI*2);ctx.fill();
     if(i%9===0){
       ctx.shadowColor='#ff243f';ctx.shadowBlur=6;
       ctx.fillRect(x-.45,y-.45,.9,.9);
       ctx.shadowBlur=0;
     }
   }
   // Algumas fagulhas continuam flutuando suavemente, sem esconder o desenho.
   const ambient=smooth(clamp((t-.5)/2));
   for(const p of dust){
     let x=p.x+Math.sin(t*p.speed+p.phase)*25;
     let y=(p.y-t*p.speed*19+height*5)%height;
     let blink=.45+.55*Math.sin(t*2+p.phase);
     ctx.fillStyle=`rgba(255,30,48,${ambient*p.opacity*blink})`;
     ctx.beginPath();ctx.arc(x,y,p.r,0,Math.PI*2);ctx.fill();
   }
   // Brilhos pontuais, mas sem cobrir as linhas da rosa.
   if(t>3.8){
     const sparkleAlpha=smooth(clamp((t-3.8)/1.2));
     for(let i=0;i<16;i++){
       const p=particles[(i*347)%particles.length];
       if(!p)continue;
       const pulse=Math.pow(Math.max(0,Math.sin(t*1.7+i*2.2)),10);
       if(pulse<.1)continue;
       let len=(2+pulse*2.2)*Math.min(drawW/340,1.5);
       ctx.strokeStyle=`rgba(255,106,116,${.38*pulse*sparkleAlpha})`;
       ctx.lineWidth=.8;
       ctx.beginPath();ctx.moveTo(p.tx-len,p.ty);ctx.lineTo(p.tx+len,p.ty);
       ctx.moveTo(p.tx,p.ty-len);ctx.lineTo(p.tx,p.ty+len);ctx.stroke();
     }
   }
   ctx.restore();
   requestAnimationFrame(render);
 }

 function loadArt(){
   const svgCopy=art.cloneNode(true);
   svgCopy.removeAttribute('style');
   svgCopy.setAttribute('width',ART_W);
   svgCopy.setAttribute('height',ART_H);
   const markup=new XMLSerializer().serializeToString(svgCopy);
   const image=new Image();
   image.onload=()=>{bitmap=image;loaded=true;seed();};
   image.onerror=()=>{art.style.cssText='position:absolute;inset:0;margin:auto;width:min(95vw,600px);height:min(95vh,850px);opacity:1';};
   image.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(markup);
 }
 window.addEventListener('resize',resize,{passive:true});
 document.addEventListener('pointerdown',()=>{if(loaded)seed();},{passive:true});
 document.addEventListener('visibilitychange',()=>{if(!document.hidden && loaded)startAt=performance.now()-DURATION;});
 resize();loadArt();requestAnimationFrame(render);
})();
</script>
